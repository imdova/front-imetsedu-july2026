# nginx snippet for imetsedu.com — SEO / security headers.
#
# Next.js sets these per response (see `headers()` in next.config.ts), which
# covers everything it renders. nginx still needs its own copy for what Next
# never sees: redirects it issues itself, static files served straight from
# disk, and error pages produced while the app is restarting.
#
# Apply inside the HTTPS `server { }` block for the site, then:
#   nginx -t && systemctl reload nginx

# Do not advertise the nginx version in responses or on error pages.
server_tokens off;

# A year, subdomains included. `always` matters: without it the header is
# dropped on 4xx/5xx, which is exactly when the app is least healthy.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Kept in step with next.config.ts so a response served by nginx alone — a
# static file, a redirect, a 502 while pm2 restarts — carries the same rules.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Deliberately no Content-Security-Policy here. GTM and Clarity both inject
# scripts at runtime; a policy written without auditing what they load would
# break analytics silently. That is its own task.
